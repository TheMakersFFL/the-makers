name: Upgrade Makers Wednesday Collector
on:
  push:
    paths:
      - '.github/workflows/upgrade-wednesday-collector.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten Wednesday collector validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Makers_Weekly_Collector.user.js')
          s=p.read_text()
          s=s.replace('@version      1.3.0','@version      1.3.1')
          s=s.replace("const VERSION='1.3.0';","const VERSION='1.3.1';")
          s=s.replace("['Transactions',tx.length===0||structuredTx===tx.length,`${structuredTx}/${tx.length} structured`]", "['Transactions',tx.length>0&&structuredTx===tx.length,`${structuredTx}/${tx.length} structured`]")
          p.write_text(s)
          Path('Makers_Weekly_Collector_v1.3.1.txt').write_text(s)
          PY
      - name: Syntax and validation checks
        run: |
          node --check Makers_Weekly_Collector.user.js
          grep -q '@version      1.3.1' Makers_Weekly_Collector.user.js
          grep -q "tx.length>0&&structuredTx===tx.length" Makers_Weekly_Collector.user.js
          grep -q "workflow:'wednesday-combined'" Makers_Weekly_Collector.user.js
      - name: Commit upgraded collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makers_Weekly_Collector.user.js Makers_Weekly_Collector_v1.3.1.txt
          git commit -m "Tighten Makers Wednesday collector v1.3.1"
          git push