name: Upgrade Makers Wednesday Collector
on:
  push:
    paths:
      - '.github/workflows/upgrade-wednesday-collector.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert collector to Wednesday workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Makers_Weekly_Collector.user.js')
          s=p.read_text()
          s=s.replace('Makers Weekly Collector — Tuesday + Thursday','Makers Weekly Collector — Wednesday')
          s=s.replace('@version      1.2.5','@version      1.3.0')
          s=s.replace("const VERSION='1.2.5';","const VERSION='1.3.0';")
          s=s.replace('Collect Yahoo Fantasy league data twice a week for The Makers, with verified matchup scores, clean lineups, projections, transactions and waiver data.','Collect Yahoo Fantasy league data once each Wednesday after waivers for The Makers, combining the prior-week recap with post-waiver rosters, projections and the upcoming-week preview.')
          s=s.replace("if(!state.targetWeek)state.targetWeek=2;","if(!state.targetWeek)state.targetWeek=2;\n  state.mode='post-mnf'; // internal compatibility: Wednesday uses the full recap + preview collection path")
          s=s.replace("state={...initialState(),mode:state.mode||'post-mnf',targetWeek:state.targetWeek||2,teamMap:state.teamMap||[]};","state={...initialState(),mode:'post-mnf',targetWeek:state.targetWeek||2,teamMap:state.teamMap||[]};")
          old="const note=state.mode==='post-mnf'?'Run after MNF is final. Auto Collect now captures final team scores plus every completed-week lineup, starter/bench designation, and player actual/projection values when Yahoo exposes them.':'Run Thursday after waivers clear. It compares against Tuesday and captures post-waiver rosters, transactions, free agents and Week preview data.';"
          new="const note='Run Wednesday after waivers clear. One collection captures the previous week final results and lineups, current post-waiver rosters and transactions, free agents, standings, and the upcoming week Yahoo projections for the full recap + preview update.';"
          s=s.replace(old,new)
          s=s.replace('>POST-MNF</button>','>WEDNESDAY</button>')
          s=s.replace('.makersff-modes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:7px 0}', '.makersff-modes{display:grid;grid-template-columns:1fr;gap:7px;margin:7px 0}.makersff-modes button[data-mode="post-waivers"]{display:none}')
          s=s.replace("${state.mode==='post-mnf'?`recaps W${Math.max(0,(state.targetWeek||1)-1)}`:'preview target'}", "${`recap W${Math.max(0,(state.targetWeek||1)-1)} + preview W${state.targetWeek||1}`}" )
          s=s.replace("mode:state.mode,targetWeek:target", "mode:state.mode,workflow:'wednesday-combined',targetWeek:target")
          s=s.replace("const mode=o.mode==='post-mnf'?'POST_MNF':'POST_WAIVERS',name=", "const mode='WEDNESDAY',name=")
          s=s.replace('Clear the current collector workspace? Saved Tuesday/Thursday snapshots stay available for comparison.','Clear the current Wednesday collector workspace?')
          p.write_text(s)
          Path('Makers_Weekly_Collector_v1.3.0.txt').write_text(s)
          PY
      - name: Syntax and workflow checks
        run: |
          node --check Makers_Weekly_Collector.user.js
          grep -q 'Makers Weekly Collector — Wednesday' Makers_Weekly_Collector.user.js
          grep -q "workflow:'wednesday-combined'" Makers_Weekly_Collector.user.js
          grep -q "const mode='WEDNESDAY'" Makers_Weekly_Collector.user.js
      - name: Commit upgraded collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makers_Weekly_Collector.user.js Makers_Weekly_Collector_v1.3.0.txt
          git commit -m "Upgrade Makers collector to Wednesday v1.3.0"
          git push