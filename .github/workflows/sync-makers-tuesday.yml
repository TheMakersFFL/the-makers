name: Sync Makers Tuesday Update

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: makers-tuesday-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out live Makers site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy validated Tuesday update from staging repo
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/MiscExpFFL/the-makers/main"
          FILES=(
            index.html
            analytics.html
            franchise.html
            franchises.html
            playoff-odds.html
            power-rankings.html
            predictions.html
            records.html
            schedule.html
            season-2026.html
            transactions.html
            waiver-wire.html
            week.html
            weeks.html
            week-01.html
            makers-static-tuesday.js
            makers-tuesday.js
            makers-week1-tuesday-data.js
            MAKERS_WEEKLY_COLLECTOR_GUIDE.md
            MAKERS_WEEKLY_UPDATE_CHECKLIST.md
            Makers_Weekly_Collector.user.js
            Makers_Weekly_Collector_v1.2.5.txt
            README_GITHUB.txt
            UPDATE_GUIDE.txt
            UPLOAD_INSTRUCTIONS.txt
          )
          for f in "${FILES[@]}"; do
            echo "Syncing $f"
            curl -fsSL "$BASE/$f" -o "$f"
          done

      - name: Preserve live site shell and enable Tuesday patches
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("site.js")
          s = p.read_text(encoding="utf-8")
          key = "makers-week1-tuesday-data.js?v=makers-20260915-tuesday1"
          if key not in s:
              loader = """
 const tuesday=document.createElement('script');
 tuesday.src='makers-week1-tuesday-data.js?v=makers-20260915-tuesday1';
 tuesday.onload=()=>{const patch=document.createElement('script');patch.src='makers-static-tuesday.js?v=makers-20260915-tuesday1';document.body.appendChild(patch)};
 document.body.appendChild(tuesday);
"""
              pos = s.rfind("})();")
              if pos < 0:
                  raise RuntimeError("Could not locate site.js IIFE terminator")
              s = s[:pos] + loader + s[pos:]
              p.write_text(s, encoding="utf-8")

          for html in Path('.').glob('*.html'):
              text = html.read_text(encoding='utf-8')
              updated = re.sub(r'site\.js\?v=[^"\']+', 'site.js?v=makers-20260915-tuesday1', text)
              if updated != text:
                  html.write_text(updated, encoding='utf-8')

      - name: Validate Tuesday deployment
        shell: bash
        run: |
          set -euo pipefail
          node --check makers-tuesday.js
          node --check makers-static-tuesday.js
          node --check makers-week1-tuesday-data.js
          grep -q '"currentWeek": 2' makers-week1-tuesday-data.js
          grep -q 'makers-week1-tuesday-data.js' index.html
          grep -q 'makers-tuesday.js' season-2026.html
          grep -q 'makers-tuesday.js' power-rankings.html
          grep -q 'makers-tuesday.js' playoff-odds.html

      - name: Commit live site update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Deploy Makers Week 1 Tuesday update [skip ci]"
          git push origin HEAD:main
